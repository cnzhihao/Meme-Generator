<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEME · 梗图实验室 | 中文梗图生成器</title>
  <meta name="description" content="上传图片，输入中文文案，一键导出高清梗图 PNG。" />
  <meta name="theme-color" content="#ffe100" />
  <meta name="application-name" content="MEME · 梗图实验室" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MEME · 梗图实验室" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="MEME · 梗图实验室 | 中文梗图生成器" />
  <meta property="og:description" content="上传图片，输入中文文案，一键导出高清梗图 PNG。" />

  <meta property="og:image" content="https://meme-generator.fhxqtech.com/og-image.png" />

  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Meme Generator - Upload image, add caption, export PNG" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MEME · 梗图实验室 | 中文梗图生成器" />
  <meta name="twitter:description" content="上传图片，输入中文文案，一键导出高清梗图 PNG。" />
  <meta name="twitter:image" content="https://meme-generator.fhxqtech.com/og-image.png" />
  <link rel="canonical" href="https://meme-generator.fhxqtech.com/" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260626-launch" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">MEME</span>
      <span class="brand-zh">梗图实验室</span>
    </div>
    <div class="top-actions">
      <button id="agentPromptBtn" class="stamp stamp-secondary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2v4" />
          <path d="M12 18v4" />
          <path d="M4.93 4.93 7.76 7.76" />
          <path d="m16.24 16.24 2.83 2.83" />
          <path d="M2 12h4" />
          <path d="M18 12h4" />
          <path d="m4.93 19.07 2.83-2.83" />
          <path d="m16.24 7.76 2.83-2.83" />
        </svg>
        Agent Prompt
      </button>
      <button id="copyImageBtn" class="stamp stamp-secondary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        复制图片
      </button>
      <button id="downloadBtn" class="stamp" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="m7 11 5 5 5-5" />
          <path d="M5 21h14" />
        </svg>
        下载 PNG
      </button>
    </div>
  </header>

  <main>
    <aside class="deck">
      <!-- 01 模式 -->
      <section class="grp">
        <h2 class="grp-h"><span class="num">01</span> 模式</h2>
        <div class="segmented" role="radiogroup" aria-label="梗图模式">
          <label class="segmented-option">
            <input id="modeFreeText" type="radio" name="memeMode" value="freeText" checked />
            <span>自由图文</span>
          </label>
          <label class="segmented-option">
            <input id="modeComicTemplate" type="radio" name="memeMode" value="comicTemplate" />
            <span>分镜模板</span>
          </label>
        </div>
      </section>

      <!-- 02 素材 -->
      <section class="grp">
        <h2 class="grp-h"><span class="num">02</span> 素材</h2>
        <div id="freeTextAssetPanel" class="mode-panel">
          <label class="drop" for="imageInput">
            <span class="drop-ico">↥</span>
            <strong>点击选择图片</strong>
            <small>导出尺寸 = 原图尺寸 · 建议 1:1 或竖图</small>
          </label>
          <input
            id="imageInput"
            class="file-input-automation"
            type="file"
            accept="image/*"
            aria-label="上传梗图图片"
            data-testid="meme-image-input"
          />
          <input
            id="agentImageUrl"
            class="agent-image-url"
            type="text"
            autocomplete="off"
            aria-label="Agent image URL"
            data-testid="meme-agent-image-url"
          />
          <button
            id="agentLoadImageBtn"
            class="agent-load-image-btn"
            type="button"
            aria-label="Agent load image"
            data-testid="meme-agent-load-image"
          >Load image</button>
          <button id="clearImageBtn" class="btn ghost-danger" type="button">清空图片</button>
        </div>
        <div id="comicTemplateAssetPanel" class="mode-panel" hidden>
          <div id="templateGrid" class="template-grid" role="radiogroup" aria-label="分镜模板">
            <label class="template-card">
              <input type="radio" name="comicTemplate" value="performAgain" checked />
              <span class="template-thumb">
                <img src="assets/template-perform-again.png" alt="" />
              </span>
              <span class="template-name">你能再表演一下那个吗？</span>
            </label>
            <label class="template-card">
              <input type="radio" name="comicTemplate" value="sevenStepPodium" />
              <span class="template-thumb template-thumb-podium">
                <img src="assets/template-seven-step-podium.png" alt="七级领奖台分镜模板" />
              </span>
              <span class="template-name">七级领奖台</span>
            </label>
            <label class="template-card">
              <input type="radio" name="comicTemplate" value="goodYoureGreat" />
              <span class="template-thumb template-thumb-wide">
                <img src="assets/template-good-youre-great.png" alt="好的你真棒分镜模板" />
              </span>
              <span class="template-name">好的你真棒</span>
            </label>
          </div>
        </div>
      </section>

      <!-- 03 台词 -->
      <section class="grp">
        <h2 class="grp-h"><span class="num">03</span> 台词</h2>
        <div id="freeTextCopyPanel" class="mode-panel">
          <textarea id="memeText" spellcheck="false">第一次见女朋友家长叔叔问我：喝酒吗？
我：不喝
又问：抽烟吗？
我：不抽
叔叔又问：打牌吗？
我：不打
叔叔诧异的望向女朋友女朋友忙说：他好色！
叔叔一拍大腿：那没事了是个正常男人来坐，上菜！</textarea>
        </div>
        <div id="comicTemplateCopyPanel" class="mode-panel" hidden>
          <div id="performAgainCopyFields" class="template-copy-fields">
            <div class="field">
              <label class="fld" for="performAgainTopText">第五格上方台词</label>
              <textarea id="performAgainTopText" class="template-copy" spellcheck="false">我这辈子最拿手的事情</textarea>
            </div>
            <div class="field">
              <label class="fld" for="performAgainBottomText">第五格下方台词</label>
              <textarea id="performAgainBottomText" class="template-copy" spellcheck="false">就是把简单问题讲复杂</textarea>
            </div>
          </div>
          <div id="sevenStepCopyFields" class="template-copy-fields step-copy-fields" hidden>
            <p class="template-copy-hint">从左到右依次对应由高到低的七个台阶。</p>
            <div class="step-copy-grid">
              <div class="field"><label class="fld" for="sevenStep1Text">第 1 阶（最高）</label><textarea id="sevenStep1Text" class="template-copy" rows="2" placeholder="输入第 1 阶文案" spellcheck="false"></textarea></div>
              <div class="field"><label class="fld" for="sevenStep2Text">第 2 阶</label><textarea id="sevenStep2Text" class="template-copy" rows="2" placeholder="输入第 2 阶文案" spellcheck="false"></textarea></div>
              <div class="field"><label class="fld" for="sevenStep3Text">第 3 阶</label><textarea id="sevenStep3Text" class="template-copy" rows="2" placeholder="输入第 3 阶文案" spellcheck="false"></textarea></div>
              <div class="field"><label class="fld" for="sevenStep4Text">第 4 阶</label><textarea id="sevenStep4Text" class="template-copy" rows="2" placeholder="输入第 4 阶文案" spellcheck="false"></textarea></div>
              <div class="field"><label class="fld" for="sevenStep5Text">第 5 阶</label><textarea id="sevenStep5Text" class="template-copy" rows="2" placeholder="输入第 5 阶文案" spellcheck="false"></textarea></div>
              <div class="field"><label class="fld" for="sevenStep6Text">第 6 阶</label><textarea id="sevenStep6Text" class="template-copy" rows="2" placeholder="输入第 6 阶文案" spellcheck="false"></textarea></div>
              <div class="field"><label class="fld" for="sevenStep7Text">第 7 阶（最低）</label><textarea id="sevenStep7Text" class="template-copy" rows="2" placeholder="输入第 7 阶文案" spellcheck="false"></textarea></div>
            </div>
          </div>
          <div id="goodYoureGreatCopyFields" class="template-copy-fields" hidden>
            <div class="field">
              <label class="fld" for="goodYoureGreatTopText">第一格台词</label>
              <textarea id="goodYoureGreatTopText" class="template-copy" spellcheck="false">We're still up.</textarea>
            </div>
            <div class="field">
              <label class="fld" for="goodYoureGreatMiddleText">第二格台词</label>
              <textarea id="goodYoureGreatMiddleText" class="template-copy" spellcheck="false">OK</textarea>
            </div>
          </div>
        </div>
      </section>

      <!-- 高级设置：04 样式 + 05 排版 -->
      <details class="advanced">
        <summary>
          <span class="adv-label">高级设置</span>
          <span class="adv-tag"></span>
        </summary>
        <div class="adv-body">
          <!-- 03 样式 -->
          <section class="grp">
            <h2 class="grp-h"><span class="num">04</span> 样式</h2>
            <div class="field">
              <label class="fld" for="fontFamily">字体</label>
              <select id="fontFamily">
                <option value='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif'>系统无衬线字体</option>
                <option value='Arial, Helvetica, sans-serif'>Arial / Helvetica</option>
                <option value='"Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif'>Noto Sans SC / 思源黑体</option>
                <option value='"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'>中文系统黑体</option>
              </select>
            </div>
            <div class="grid-2">
              <div class="field">
                <label class="fld" for="fontWeight">字重</label>
                <select id="fontWeight">
                  <option value="600">半粗 600</option>
                  <option value="700" selected>粗体 700</option>
                  <option value="800">特粗 800</option>
                  <option value="900">黑体 900</option>
                </select>
              </div>
              <div class="field">
                <label class="fld" for="textColor">文字颜色</label>
                <input id="textColor" type="color" value="#000000" />
              </div>
            </div>
            <div class="field">
              <label class="fld" for="boxColor">衬底颜色</label>
              <input id="boxColor" type="color" value="#ffffff" />
            </div>
          </section>

          <!-- 04 排版 -->
          <section class="grp">
            <h2 class="grp-h"><span class="num">05</span> 排版</h2>
            <div class="grid-2">
              <div class="field">
                <label class="fld" for="fontSizePct">字号（占图宽）</label>
                <div class="slider">
                  <input id="fontSizePct" type="range" min="2" max="10" step="0.1" value="4.4" />
                  <span id="fontSizePctValue" class="pill">4.4%</span>
                </div>
              </div>
              <div class="field">
                <label class="fld" for="lineHeight">行距</label>
                <div class="slider">
                  <input id="lineHeight" type="range" min="1.0" max="2.0" step="0.05" value="1.6" />
                  <span id="lineHeightValue" class="pill">1.60</span>
                </div>
              </div>
              <div class="field">
                <label class="fld" for="padXPct">衬底左右边距</label>
                <div class="slider">
                  <input id="padXPct" type="range" min="0.1" max="1.8" step="0.05" value="0.25" />
                  <span id="padXPctValue" class="pill">0.25em</span>
                </div>
              </div>
              <div class="field">
                <label class="fld" for="boxHeightEm">衬底高度</label>
                <div class="slider">
                  <input id="boxHeightEm" type="range" min="1.0" max="1.6" step="0.02" value="1.28" />
                  <span id="boxHeightEmValue" class="pill">1.28em</span>
                </div>
              </div>
              <div class="field">
                <label class="fld" for="radiusEm">衬底圆角</label>
                <div class="slider">
                  <input id="radiusEm" type="range" min="0" max="0.5" step="0.02" value="0" />
                  <span id="radiusEmValue" class="pill">0em</span>
                </div>
              </div>
              <div class="field">
                <label class="fld" for="maxWidthPct">单行最大宽度</label>
                <div class="slider">
                  <input id="maxWidthPct" type="range" min="40" max="96" step="1" value="82" />
                  <span id="maxWidthPctValue" class="pill">82%</span>
                </div>
              </div>
            </div>
          </section>
        </div>
      </details>
    </aside>

    <section class="stage">
      <div class="canvas-wrap">
        <canvas id="canvas" width="1080" height="1080" aria-label="梗图预览"></canvas>
      </div>
    </section>
  </main>

  <div id="agentPromptModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="agentPromptTitle" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <div>
          <p class="modal-kicker">OpenCLI</p>
          <h2 id="agentPromptTitle">Agent Prompt</h2>
        </div>
        <button id="closeAgentPromptBtn" class="icon-btn" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12" />
            <path d="M18 6 6 18" />
          </svg>
        </button>
      </div>
      <textarea id="agentPromptText" class="prompt-box" readonly spellcheck="false"></textarea>
      <div class="modal-actions">
        <button id="copyAgentPromptBtn" class="stamp" type="button">复制 Prompt</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=20260625-opencli-plugin"></script>
</body>
</html>
